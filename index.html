<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&display=swap">
<link rel="stylesheet" href="styles.css">
<title>MemeVision AI Pro</title></head>
<body><div class="app">
<header><span class="logo">MEMEVISION <b>PRO</b></span><div><button id="btnHist" class="ic" aria-label="Histórico">🕘</button><button id="btnSet" class="ic" aria-label="Configurações">⚙️</button></div></header>
<main>
<section class="card">
<label class="drop"><input id="file" type="file" accept="image/*" hidden><img id="thumb" hidden alt="Imagem escolhida"><span id="dropTxt">🖼️ Escolher imagem</span></label>
<input id="tema" placeholder="Tema (opcional): segunda-feira, dieta…" maxlength="80">
<div class="chips" id="chips"></div>
<button id="gen" class="primary">GERAR MEMES</button>
<p id="err" class="err" hidden></p>
</section>
<section id="res" class="card" hidden>
<canvas id="cv"></canvas>
<div class="seg"><button data-l="bars" class="on">Faixas</button><button data-l="over">Clássico</button></div>
<textarea id="top" rows="2" placeholder="Texto de cima"></textarea>
<textarea id="bot" rows="2" placeholder="Texto de baixo (opcional)"></textarea>
<div class="row"><button id="copy">📋 Copiar</button><button id="speak">🔊 Ouvir</button><button id="share">📤 Enviar</button></div>
<div class="row"><button id="more">🔄 Outra piada</button><button id="dl" class="primary">💾 Baixar PNG</button></div>
<h3>Outras ideias</h3><div id="ideas"></div>
</section></main></div>
<dialog id="dSet"><h2>Configurações</h2>
<label>Sua chave Gemini</label><input id="kKey" type="password" autocomplete="off" placeholder="Cole aqui sua chave">
<small>Grátis em aistudio.google.com/apikey. Fica só neste aparelho e vai direto para o Google.</small>
<label>Modelo</label><select id="kModel"><option value="gemini-2.5-flash">2.5 Flash (equilibrado)</option><option value="gemini-2.5-flash-lite">2.5 Flash-Lite (mais rápido)</option></select>
<label>Idioma / gírias</label><input id="kLang" list="langs"><datalist id="langs"><option value="Brasil"><option value="Carioca"><option value="Paulistano"><option value="Nordestino"><option value="Portugal"><option value="Gamer"><option value="English"><option value="Español"></datalist>
<div class="row" style="margin-top:16px"><button onclick="this.closest('dialog').close()">Cancelar</button><button id="sSave" class="primary">Salvar</button></div></dialog>
<dialog id="dHist"><h2>Histórico</h2><div id="hList"></div><div class="row" style="margin-top:16px"><button id="hClear">Limpar</button><button onclick="this.closest('dialog').close()">Fechar</button></div></dialog>
<div id="toast"></div>
<script src="app.js"></script>
</body></html>
